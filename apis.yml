aid: epocrates
name: Epocrates
description: 'Epocrates is a mobile clinical reference application, part of athenahealth,
  relied on by healthcare professionals for more than 25 years to support point-of-care
  decisions. It provides a drug reference database, a drug-drug interaction checker,
  a pill identifier, clinical practice guidelines, medical calculators, and a herbs
  and supplements reference, with the premium epocrates+ subscription adding expanded
  content. Epocrates does not publish a public developer API or SDK; this profile
  captures the company''s public web identity and domain-security posture for the
  API Evangelist network. Sector: healthcare.'
